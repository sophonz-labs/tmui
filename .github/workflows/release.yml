name: release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: release notes
        run: |
          notes="release-notes/${GITHUB_REF_NAME}.md"
          [ -f "$notes" ] || { echo "::error::tag ${GITHUB_REF_NAME} has no $notes"; exit 1; }
      - name: build
        run: |
          mkdir -p dist
          for os in darwin linux; do
            for arch in amd64 arm64; do
              dir="dist/tmui-$os-$arch"
              mkdir -p "$dir"
              CGO_ENABLED=0 GOOS=$os GOARCH=$arch go build -trimpath \
                -ldflags "-s -w -X main.version=${GITHUB_REF_NAME}" -o "$dir/tmui" .
              cp LICENSE README.md "$dir/"
              tar -C "$dir" -czf "dist/tmui-$os-$arch.tar.gz" tmui LICENSE README.md
            done
          done
          cd dist && sha256sum tmui-*.tar.gz > checksums.txt && cat checksums.txt
      - name: publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" dist/tmui-*.tar.gz dist/checksums.txt \
            --title "$GITHUB_REF_NAME" --notes-file "release-notes/${GITHUB_REF_NAME}.md" --verify-tag
